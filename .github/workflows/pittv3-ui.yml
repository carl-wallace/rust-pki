# CI for the pittv3 UI crates, which certval.yml excludes: the dioxus 0.7
# dependency tree requires rustc >= 1.88 (home/built/image/time), above that
# workflow's 1.85 MSRV legs, and pittv3-gui needs Linux system packages absent
# from stock runners. Splitting them here ends the exclusion without moving
# certval's MSRV. Build-only: the UI has no headless test surface yet.
name: pittv3-ui

on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # dioxus-desktop on Linux needs webkit2gtk/gtk3/xdo development packages.
      #
      # Every apt option here bounds a wait that is unbounded by default, because
      # each one has been observed to stall the runner indefinitely rather than
      # fail: the dpkg lock can be held by the image's background package updates,
      # and a mirror connection can stall mid-transfer with no read timeout. The
      # job-level timeout above is the outer bound for anything these miss.
      - run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
        env:
          DEBIAN_FRONTEND: noninteractive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p pittv3-gui-lib
      - run: cargo check -p pittv3-gui
      - run: cargo test -p pittv3-wasm -p pittv3-gui -p pittv3-gui-lib --all-features

  # The service depends on pittv3-gui-lib for the shared validation path, so it carries the same
  # 1.88 floor and belongs here rather than in certval.yml's MSRV legs. Tested rather than merely
  # checked: unlike the GUI crates these have a headless test surface.
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p pittv3-relay -p pittv3-service

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Restates the workflow-level -Dwarnings alongside the stack reserve, because RUSTFLAGS in the
    # environment *replaces* the target rustflags in .cargo/config.toml rather than merging with
    # them. Without this the wasm32 entry there is silently discarded and this job builds the very
    # binary that entry exists to prevent -- silently, since a missing link argument is not a
    # compile error. Keep the size in step with .cargo/config.toml.
    env:
      RUSTFLAGS: "-Dwarnings -C link-arg=-zstack-size=8388608"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p pittv3-wasm --target wasm32-unknown-unknown
      # The build above regenerated stores.manifest from the providers the lock
      # pins. If it differs from the committed one, the trust material this app
      # ships has changed and the change is not in the diff being reviewed --
      # which is the whole reason the manifest is tracked while the artifacts it
      # describes are not. `git diff` names the anchors that moved.
      - name: stores.manifest is in step with the locked providers
        run: git diff --exit-code -- pittv3-wasm/stores.manifest
      # The crate's unit tests are compiled by no other leg, and were never compiled by any: a
      # plain `build` skips `#[cfg(test)]` code, and the crate cannot be built for the host at
      # all, `dioxus-web` needing `web_sys::Window::location`. So they type-checked nowhere, and
      # a struct gaining a field left their literals broken with nothing to say so. `--no-run`
      # compiles them and stops; running them needs wasm-bindgen-test and a headless browser,
      # which is a separate decision.
      - run: cargo test -p pittv3-wasm --target wasm32-unknown-unknown --no-run

  # The doc half of certval.yml's rustdoc job, for the crates it excludes. Broken doc links are
  # invisible to check and clippy; only rustdoc resolves them. pittv3-wasm is documented for
  # wasm32 because that is the target its cfg'd items exist on.
  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      # documenting pittv3-gui compiles its dependencies, so the same packages the gui job needs,
      # installed with the same bounds on apt's otherwise unbounded waits
      - run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
        env:
          DEBIAN_FRONTEND: noninteractive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo doc -p pittv3-gui-lib -p pittv3-gui --no-deps
      # pittv3-gui-lib gates items on `std`, and a link to one resolves only when it is enabled;
      # the run above covers the links that must hold without it.
      - run: cargo doc -p pittv3-gui-lib --no-deps --all-features
      - run: cargo doc -p pittv3-wasm --target wasm32-unknown-unknown --no-deps
      - run: cargo doc -p pittv3-relay -p pittv3-service --no-deps
