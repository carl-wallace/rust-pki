name: certval

on:
  pull_request:
  push:
    branches: main
  # Manual runs, matching pittv3-ui.yml. Worth having for its own sake -- a re-run after a
  # transient failure, or a check against a branch before opening a PR -- and it is also the
  # probe that tells an Actions problem apart from a trigger-matching one, since a dispatch
  # that starts proves the workflow is enabled and reachable.
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      # pittv3-relay and pittv3-service are excluded for the same reason: both declare 1.88, and
      # pittv3-service depends on pittv3-gui-lib, so leaving them in drags the dioxus tree back
      # into these legs transitively and defeats the exclusion above. They are covered in
      # pittv3-ui.yml, which runs on stable.
      # the UI crates are excluded: the dioxus 0.7 dependency tree requires rustc >= 1.88
      # (home/built/image/time), above the 1.85 MSRV here, and pittv3-gui additionally needs
      # Linux system packages (libwebkit2gtk-4.1-dev, libgtk-3-dev, libxdo-dev) absent from
      # the runner; re-include as the desktop work stabilizes
      - run: cargo hack build --each-feature --workspace --exclude pittv3-gui --exclude pittv3-gui-lib --exclude pittv3-wasm --exclude pittv3-relay --exclude pittv3-service

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      # see build job note: UI crates excluded (dioxus tree MSRV + system packages)
      - run: cargo hack test --each-feature --workspace --exclude pittv3-gui --exclude pittv3-gui-lib --exclude pittv3-wasm --exclude pittv3-relay --exclude pittv3-service

  # --each-feature never combines features, so the std+rsa test population
  # (revocation.rs, rfc822_dn_name_constraints.rs, the pkits_2048 std variants)
  # otherwise runs on dev machines only. This job executes it. Verified to need
  # no network and no RUST_MIN_STACK override (2026-07-20).
  test-combined:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test -p certval --features std,rsa,revocation,pqc,eddsa

  # Windows is not a portability afterthought here. The CAPI store support is Windows-only code no
  # other leg compiles, and the SLH-DSA stack reserve in .cargo/config.toml is a Windows-only link
  # setting. Both were unreachable from an Ubuntu-only matrix, which is how a stack overflow in the
  # 256-bit SLH-DSA parameter sets and a path-separator assumption in an integration test both sat
  # green until someone ran the suite on Windows.
  #
  # Stable only, and not part of the MSRV matrix: this is here to cover a platform, not a toolchain
  # floor, and the Ubuntu legs above already hold the 1.85 line.
  windows:
    name: windows (build + test, incl. capi)
    runs-on: windows-latest
    timeout-minutes: 30
    # Job-level, restating the workflow-level -Dwarnings, because RUSTFLAGS in the environment
    # *replaces* the target rustflags in .cargo/config.toml rather than merging with them. Without
    # this the x86_64-pc-windows-msvc entry there is discarded and the SLH-DSA tests overflow the
    # 1MB stack MSVC reserves by default. Keep the size in step with .cargo/config.toml.
    env:
      RUSTFLAGS: "-Dwarnings -C link-arg=/STACK:8388608"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Same exclusions as the Ubuntu legs, so the two cover the same crates. Note the reasons do
      # not carry over: pittv3-gui is excluded there for missing Linux system packages, which
      # Windows does not need, and its MSRV floor is below stable anyway. It stays out here on
      # build cost alone -- pulling the dioxus tree onto a Windows runner is minutes, not seconds.
      # Its store selector holds the only CAPI code no job compiles, so re-including it is a real
      # gain whenever that cost is acceptable; the tests are headless and do not open a window.
      - run: cargo test --workspace --exclude pittv3-gui --exclude pittv3-gui-lib --exclude pittv3-wasm --exclude pittv3-relay --exclude pittv3-service
      - run: cargo test -p certval --features capi
      # pittv3 pulls pittv3-lib/capi and certval/capi in behind it, so this covers the whole chain
      # in one run. Note the runner is not elevated: the LocalMachine paths return PermissionDenied
      # here, which the tests treat as the expected unelevated outcome rather than a failure. That
      # half stays uncovered by CI.
      - run: cargo test -p pittv3 --features capi

  # Lints run on stable only, deliberately not across the MSRV matrix: clippy's diagnostics differ
  # between toolchains, so linting against the 1.85 pin reports on a compiler nobody develops with.
  # The pre-commit hook runs the same commands locally so they fail before a push — an early warning,
  # not a replacement for these jobs.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      # --all covers every workspace member, including the UI crates the compiling jobs exclude:
      # rustfmt parses rather than builds, so neither the dioxus MSRV nor the missing system
      # packages apply.
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      # see build job note: UI crates excluded (dioxus tree MSRV + system packages)
      - run: cargo clippy --workspace --all-targets --exclude pittv3-gui --exclude pittv3-gui-lib --exclude pittv3-wasm --exclude pittv3-relay --exclude pittv3-service -- -D warnings
      # --all-features cannot catch warnings that only exist when a feature is ABSENT (an import
      # used solely by a gated path), which is why the default-feature run above is kept as well.
      - run: cargo clippy --workspace --all-targets --all-features --exclude pittv3-gui --exclude pittv3-gui-lib --exclude pittv3-wasm --exclude pittv3-relay --exclude pittv3-service -- -D warnings

  # Broken doc links are invisible to check, clippy and test: they surface only when rustdoc
  # resolves them, so a dead `[Foo]` ships in the published docs. certval declares
  # `all-features = true` for docs.rs, so the second run is the shape docs.rs will build.
  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # see build job note: UI crates excluded (dioxus tree MSRV + system packages)
      - run: cargo doc --workspace --no-deps --exclude pittv3-gui --exclude pittv3-gui-lib --exclude pittv3-wasm --exclude pittv3-relay --exclude pittv3-service
      # A link to a `#[cfg(feature = ...)]` item resolves only when that feature is on, so the two
      # runs catch different things: this one the links that need a feature, the one above the
      # links that break without it.
      - run: cargo doc --workspace --no-deps --all-features --exclude pittv3-gui --exclude pittv3-gui-lib --exclude pittv3-wasm --exclude pittv3-relay --exclude pittv3-service

  # certval is no_std-capable; prove it links for an embedded target. Build-only
  # (no test runner on the target). thumbv7em-none-eabihf deliberately — an
  # x86_64-unknown-none check can silently tolerate std leakage this catches.
  build-nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build -p certval --no-default-features --target thumbv7em-none-eabihf

  # The six build commands the module documentation gives, run exactly as documented: from the
  # workspace root, without -p. That is the point of the job -- with -p they resolve features for
  # pittv3 alone and cannot regress. Without it, cargo resolves across default-members, pittv3-gui
  # asks pittv3-lib for `remote` (which implies `std`), and pittv3-lib comes up above whatever
  # pittv3 itself asked for. Anything in the binary that decides by its own features what
  # pittv3-lib contains desynchronizes there, which is how three of these six stopped compiling.
  #
  # Cheap despite naming the frontends: only the pittv3 bin target is built, so the dioxus tree is
  # resolved into the graph and never compiled. That keeps this leg clear of the 1.88 MSRV and the
  # Linux system packages the other jobs exclude those crates for, hence stable only.
  documented-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --bin pittv3
      - run: cargo build --bin pittv3 --no-default-features --features std
      - run: cargo build --bin pittv3 --no-default-features --features revocation,std
      - run: cargo build --bin pittv3 --no-default-features --features std_app
      - run: cargo build --bin pittv3 --no-default-features --features revocation
      - run: cargo build --bin pittv3 --no-default-features

  x509-limbo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 
      - run: make -C support/x509-limbo-tests
      # You are expected to checkin the result in the repository
      - run: git diff --exit-code support/x509-limbo-tests/rust-certval.json
