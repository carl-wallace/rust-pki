# Builds pittv3 and pittv3-gui for Linux, macOS and Windows and puts the binaries in a draft GitHub
# release, for the macOS and Windows binaries to be signed and the release published by
# pittv3-publish.yml. A push of a tag named pittv3-v<version> makes the draft; <version> must be the
# version in both pittv3/Cargo.toml and pittv3-gui/Cargo.toml.
#
# Everything but the signatures is done here, from the tag, so that what is signed is what CI built:
# each archive carries a build provenance attestation, which is checked before what is in it is
# signed. Signing replaces the macOS and Windows archives in the draft with archives of the signed
# binaries, under the same names; pittv3-publish.yml then checks the signatures, writes SHA256SUMS
# and an attestation over the final files, and publishes.
#
# A manual run builds and smoke-tests the same binaries and keeps them as workflow artifacts, without
# making a release, which is how to try a change to this workflow before tagging. A manual run given
# release_tag builds from that existing tag and makes its draft. Run it from the tag (`gh workflow
# run pittv3-release.yml --ref <tag> -f release_tag=<tag>`), so that the provenance names the tag
# and its commit, not the branch the run was started from; the signing scripts refuse an archive
# whose provenance does not name the tag.
#
# No draft is made from a commit whose CI has not passed; see the ci job. BUILT-SHA256SUMS, attested
# with the archives, lists them as built, before signing replaces the macOS and Windows ones, and
# stays in the published release.
name: pittv3-release

on:
  push:
    tags: ["pittv3-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag (pittv3-v<version>) to build and make a draft release of; empty to build without one"
        required: false
        default: ""
      skip_ci_check:
        description: "Make the draft even though CI has not passed on the tag's commit (the release notes say so)"
        type: boolean
        default: false

# This workflow sets no RUSTFLAGS, unlike certval.yml and pittv3-ui.yml. RUSTFLAGS in the environment
# replaces the target rustflags in .cargo/config.toml, and the Windows binary needs the /STACK
# reserve set there: without it pittv3.exe overflows its stack on the 256-bit SLH-DSA parameter
# sets. The smoke test below validates an SLH-DSA-SHAKE-256s certificate, so a lost reserve fails
# the build rather than shipping.

jobs:
  # CI must have passed on the commit being built. certval.yml and pittv3-ui.yml run on every push to main and every pull request, so a merged commit has a run, which may
  # still be going when the tag is pushed: this waits for it. A manual run can pass skip_ci_check,
  # e.g. when CI failed for a reason unrelated to the change; the draft's notes then say that CI had
  # not passed. A tag push cannot skip it, and a build without a release only reports the result.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ inputs.release_tag || github.sha }}
      WORKFLOWS: certval.yml pittv3-ui.yml
      RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
      SKIP: ${{ inputs.skip_ci_check }}
    outputs:
      skipped: ${{ steps.ci.outputs.skipped }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - name: CI passed on the commit being built
        id: ci
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          failed=""
          for wf in $WORKFLOWS; do
            while :; do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$sha" \
                --jq '[.workflow_runs[] | .conclusion // "pending"] | join(" ")')
              echo "$wf on $sha: ${runs:-no run}"
              case " $runs " in
                *" success "*) break ;;
                *" pending "*) sleep 60 ;;
                *) failed="$failed $wf"; break ;;
              esac
            done
          done
          if [ -z "$failed" ]; then
            exit 0
          elif [ "$RELEASING" != true ]; then
            echo "::warning::CI has not passed on $sha:$failed; a build without a release goes ahead"
          elif [ "$SKIP" = true ]; then
            echo "::warning::CI has not passed on $sha:$failed; building anyway (skip_ci_check)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI has not passed on $sha:$failed"
            exit 1
          fi

  build:
    name: build ${{ matrix.package }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [pittv3, pittv3-gui]
        platform:
          # 22.04 rather than ubuntu-latest so the CLI needs only glibc 2.35, and runs on older
          # distributions as well as current ones. TLS is rustls over aws-lc, linked statically,
          # so glibc is the only system library the CLI loads. The GUI links webkit2gtk-4.1, GTK 3
          # and libxdo dynamically, so a user needs their runtime packages installed; 22.04 is the
          # oldest Ubuntu that has webkit2gtk-4.1.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builds: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            features: ""
            archive: tar.gz
          # One universal binary, for Apple silicon and Intel Macs alike: both are built and
          # combined with lipo, under the name cargo-binstall looks for on any Mac.
          - os: macos-latest
            target: universal-apple-darwin
            builds: aarch64-apple-darwin x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            features: ""
            archive: tar.gz
          # capi adds the Windows certificate stores as trust anchor sources (the GUI's store
          # selector, for pittv3-gui).
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builds: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            features: "--features capi"
            archive: zip
        include:
          - package: pittv3
            readme: pittv3/README.md
            changelog: pittv3/CHANGELOG.md
          - package: pittv3-gui
            readme: pittv3-gui/README.md
            changelog: ""
    env:
      ARCHIVE_TARGET: ${{ matrix.platform.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # The same packages, with the same bounds on apt's waits, as pittv3-ui.yml's gui job.
      - if: runner.os == 'Linux' && matrix.package == 'pittv3-gui'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
        env:
          DEBIAN_FRONTEND: noninteractive
      # A fixed version rather than stable, so that a release can be rebuilt with the compiler that
      # built it; bump it on purpose.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.platform.rust_targets }}
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "${{ matrix.package }}") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          if [ "$tag" != "pittv3-v${{ steps.version.outputs.version }}" ]; then
            echo "tag $tag does not match ${{ matrix.package }} ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Build
        run: |
          for t in ${{ matrix.platform.builds }}; do
            cargo build --release --locked -p ${{ matrix.package }} --target "$t" ${{ matrix.platform.features }}
          done
      # The binary to package: the one build, or on macOS the two combined.
      - name: Combine
        id: bin
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          name=${{ matrix.package }}
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p universal
            lipo -create -output "universal/$name" \
              "target/aarch64-apple-darwin/release/$name" "target/x86_64-apple-darwin/release/$name"
            lipo -archs "universal/$name"
            echo "path=universal/$name" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/$ARCHIVE_TARGET/release/$name$exe" >> "$GITHUB_OUTPUT"
          fi
      # The CLI only: a window cannot be opened on these runners. On macOS this runs the runner's
      # own slice of the universal binary.
      - name: Smoke test
        if: matrix.package == 'pittv3'
        run: |
          bin=${{ steps.bin.outputs.path }}
          "$bin" --version
          "$bin" --validate-self-signed --end-entity-file \
            pittv3/tests/examples/slhdsa/SLH-DSA-SHAKE-256s-2.16.840.1.101.3.4.3.30_ta.der \
            | tee smoke.txt
          grep -q "is self-signed" smoke.txt
      - name: Package
        id: package
        run: |
          name=${{ matrix.package }}-${{ steps.version.outputs.version }}-$ARCHIVE_TARGET
          mkdir "$name"
          cp ${{ steps.bin.outputs.path }} "$name"/
          cp ${{ matrix.readme }} ${{ matrix.changelog }} certval/LICENSE-APACHE certval/LICENSE-MIT "$name"/
          if [ "${{ matrix.platform.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "file=$name.${{ matrix.platform.archive }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}-${{ matrix.platform.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  draft:
    needs: [ci, build]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CI_SKIPPED: ${{ needs.ci.outputs.skipped }}
      CI_SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # A provenance attestation for each archive as built, which is checked before what is in it is
      # signed: `gh attestation verify <file> --repo carl-wallace/rust-pki --signer-workflow
      # carl-wallace/rust-pki/.github/workflows/pittv3-release.yml --source-ref refs/tags/<tag>`.
      # BUILT-SHA256SUMS is attested too: it stays in the release, and lists the macOS and Windows
      # archives as they were before signing replaced them.
      - name: Built checksums
        working-directory: dist
        run: sha256sum pittv3-* | tee BUILT-SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/pittv3-*
            dist/BUILT-SHA256SUMS
      - name: Draft release
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          version=${tag#pittv3-v}
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          notes="pittv3 $version, the command line tool (pittv3-*) and the desktop GUI (pittv3-gui-*), for Linux (x86_64, glibc 2.35 or later), macOS (one universal binary, for Apple silicon and Intel) and Windows (x86_64). On Linux the GUI needs the WebKitGTK 4.1, GTK 3 and libxdo runtime packages, and on Windows the WebView2 runtime. SHA256SUMS lists each archive's SHA-256; each archive also carries a build provenance attestation, checked with \`gh attestation verify <archive> --repo carl-wallace/rust-pki\`. Changes are in pittv3/CHANGELOG.md."
          if [ "$CI_SKIPPED" = true ]; then
            notes="$notes

          **CI had not passed on commit $CI_SHA when this release was built.**"
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "pittv3 $version" \
            --notes "$notes" \
            $prerelease
